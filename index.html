<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrammaLab Pro 5-6 Grade</title>
    <style>
        :root { --p: #3498db; --bg: #f0f2f5; --ai: #9b59b6; --s: #2ecc71; --r: #e74c3c; --dark: #34495e; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); overflow: hidden; touch-action: none; }
        
        header { background: #fff; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--p); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .score { background: var(--dark); color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .btn-home { background: var(--p); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }

        .screen { display: none; padding: 15px; height: calc(100vh - 65px); box-sizing: border-box; overflow-y: auto; }
        .active { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .btn { padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; width: 100%; margin: 6px 0; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.1s; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        .btn-p { background: var(--p); color: #fff; }
        .btn-ai { background: var(--ai); color: #fff; }
        .btn-white { background: #fff; color: #333; border: 1px solid #ccc; }

        #stage { height: 350px; position: relative; overflow: hidden; background: #fff; border-radius: 24px; border: 4px solid var(--dark); margin-bottom: 10px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 10px; }
        
        /* АНИМАЦИИ ИГР */
        .obj-anim { animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .cloud { position: absolute; background: #fff; padding: 12px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-weight: bold; animation: fly 8s linear infinite, wave 2s infinite ease-in-out; }
        @keyframes fly { from { left: 110%; } to { left: -150px; } }
        @keyframes wave { 0%, 100% { margin-top: 0; } 50% { margin-top: 20px; } }

        .box { position: absolute; top: -100px; background: #fff; border: 3px solid var(--p); padding: 10px; border-radius: 12px; font-weight: bold; animation: fall 5s linear forwards, spin 4s infinite linear; }
        @keyframes fall { to { top: 110%; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(10deg); } }

        .mole { width: 80px; height: 80px; background: #7d5a50; color: #fff; position: absolute; bottom: -90px; border-radius: 40px 40px 10px 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 5px; box-sizing: border-box; }
        .mole.up { bottom: 20px; }

        .letter { width: 50px; height: 50px; background: var(--ai); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .letter:active { transform: translateY(-10px); }

        #joy-base { width: 100px; height: 100px; background: rgba(0,0,0,0.05); border-radius: 50%; position: relative; margin: 0 auto; display: none; border: 2px solid #ddd; touch-action: none; }
        #joy-stick { width: 44px; height: 44px; background: var(--p); border-radius: 50%; position: absolute; left: 28px; top: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .card-editor { background: #fff; padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 8px solid var(--ai); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .inp { width: 100%; margin: 6px 0; padding: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 15px; }
    </style>
</head>
<body>

<header>
    <button class="btn-home" onclick="location.reload()">🏠 Меню</button>
    <div style="font-weight: 900; color: var(--p); font-size: 1.2rem;">GrammaLab</div>
    <div class="score" id="score-val">0 ⭐</div>
</header>

<div id="sc-menu" class="screen active">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn btn-white" onclick="openEdit('maze')">👾 Лабиринт</button>
        <button class="btn btn-white" onclick="openEdit('mole')">🔨 Кроты</button>
        <button class="btn btn-white" onclick="openEdit('plane')">✈️ Самолет</button>
        <button class="btn btn-white" onclick="openEdit('fall')">📦 Падение</button>
        <button class="btn btn-white" onclick="openEdit('quiz')">📝 Тест</button>
        <button class="btn btn-white" onclick="openEdit('anagram')">🔠 Буквы</button>
        <button class="btn btn-white" onclick="openEdit('pairs')">👥 Пары</button>
    </div>
    <button class="btn btn-p" onclick="importCode()" style="margin-top:20px;">📥 ЗАГРУЗИТЬ ИГРУ</button>
</div>

<div id="sc-edit" class="screen">
    <div style="display: flex; gap: 10px; margin-bottom: 15px; position: sticky; top: 0; background: var(--bg); padding: 5px; z-index: 10;">
        <button class="btn btn-ai" style="flex: 2" onclick="showAi()">🤖 ИИ (5-6 класс)</button>
        <button class="btn btn-white" style="flex: 1" onclick="addCard({q:'', a:['','',''], c:0})">➕</button>
    </div>
    <div id="editor-list"></div>
    <button class="btn btn-p" onclick="startPlay()">ИГРАТЬ ▶️</button>
    <button class="btn btn-white" onclick="exportCode()">📤 ПОЛУЧИТЬ КОД</button>
</div>

<div id="sc-game" class="screen" style="overflow: hidden;">
    <div id="info" style="text-align:center; font-weight:bold; font-size: 1.1rem; margin-bottom:10px; color: var(--dark);"></div>
    <div id="stage"></div>
    <div id="joy-base"><div id="joy-stick"></div></div>
    <div id="game-controls"></div>
</div>

<div id="ai-overlay" style="display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; padding: 20px; overflow-y: auto;">
    <h2 style="text-align:center">Темы 5-6 класса:</h2>
    <div id="ai-list"></div>
    <button class="btn btn-p" onclick="document.getElementById('ai-overlay').style.display='none'">ЗАКРЫТЬ</button>
</div>

<script>
    let mode = '', questions = [], current = 0, score = 0, isBusy = false;
    let px = 20, py = 20;

    const AI_5_6 = {
        "Корни": {q: "Выбери слово с чередованием (ЛАГ/ЛОЖ):", a: ["Положить", "Ложка", "Ложный"], c: 0},
        "Спряжения": {q: "Глагол-исключение 2 спряжения:", a: ["Брить", "Слышать", "Писать"], c: 1},
        "Существительные": {q: "Слово 3-го склонения:", a: ["Конь", "Мышь", "Окно"], c: 1},
        "Приставки": {q: "Где пишется ПРЕ- (в значении ПЕРЕ-):", a: ["Преградить", "Пришить", "Присесть"], c: 0},
        "Члены предл.": {q: "Второстепенный член (вопрос ЧЕЙ?):", a: ["Обстоятельство", "Дополнение", "Определение"], c: 2},
        "Фонетика": {q: "В каком слове букв больше, чем звуков:", a: ["Маяк", "Ель", "Пень"], c: 2}
    };

    function showAi() {
        const list = document.getElementById('ai-list'); list.innerHTML = '';
        Object.keys(AI_5_6).forEach(k => {
            let b = document.createElement('button'); b.className = 'btn btn-white'; b.innerText = k;
            b.onclick = () => { addCard(AI_5_6[k]); document.getElementById('ai-overlay').style.display='none'; };
            list.appendChild(b);
        });
        document.getElementById('ai-overlay').style.display = 'block';
    }

    function openEdit(m) { mode = m; document.getElementById('sc-menu').classList.remove('active'); document.getElementById('sc-edit').classList.add('active'); }

    function addCard(d) {
        const div = document.createElement('div'); div.className = 'card-editor';
        const rId = 'r'+Math.random();
        div.innerHTML = `<input class="inp q-in" value="${d.q}" placeholder="Вопрос">
            ${d.a.map((v, i) => `<div style="display:flex;gap:8px;align-items:center"><input type="radio" name="${rId}" class="c-in" ${i===d.c?'checked':''}>
            <input class="inp a-in" value="${v}"></div>`).join('')}
            <button onclick="this.parentElement.remove()" style="color:red;border:none;background:none;font-size:12px;margin-top:5px">УДАЛИТЬ КАРТОЧКУ</button>`;
        document.getElementById('editor-list').appendChild(div);
        div.scrollIntoView({behavior:"smooth"});
    }

    function startPlay() {
        questions = [];
        document.querySelectorAll('.card-editor').forEach(card => {
            let opts = []; card.querySelectorAll('.a-in').forEach((inp, i) => opts.push({ t: inp.value, ok: card.querySelectorAll('.c-in')[i].checked }));
            questions.push({ q: card.querySelector('.q-in').value, opts });
        });
        if(questions.length) { current = 0; score = 0; document.getElementById('sc-edit').classList.remove('active'); document.getElementById('sc-game').classList.add('active'); render(); }
    }

    function render() {
        isBusy = false; const it = questions[current]; const st = document.getElementById('stage'); const ctrl = document.getElementById('game-controls');
        st.innerHTML = ''; ctrl.innerHTML = ''; document.getElementById('joy-base').style.display = 'none';
        document.getElementById('info').innerText = it.q;

        if(mode === 'maze') {
            document.getElementById('joy-base').style.display = 'block';
            st.innerHTML = '<div id="player"></div>'; px = 20; py = 20; updateP();
            it.opts.forEach((o, i) => {
                let t = document.createElement('div'); t.className = 'target obj-anim'; t.style.top = (40 + i*90)+"px"; t.style.right="20px";
                t.innerText = o.t; t.dataset.ok = o.ok; st.appendChild(t);
            });
            initJoy();
        } else if(mode === 'mole') {
            it.opts.forEach((o, i) => {
                let m = document.createElement('div'); m.className = 'mole'; m.style.left = (10 + i*30)+"%"; m.innerText = o.t;
                m.onclick = () => check(o.ok, m); st.appendChild(m);
                setInterval(() => m.classList.toggle('up'), 1500 + i*300);
            });
        } else if(mode === 'plane') {
            it.opts.forEach((o, i) => {
                let c = document.createElement('div'); c.className = 'cloud'; c.style.top = (30 + i*100)+"px";
                c.innerText = o.t; c.onclick = () => check(o.ok, c); st.appendChild(c);
            });
        } else if(mode === 'anagram') {
            let cur = ""; let word = it.q.toUpperCase();
            word.split('').sort(()=>Math.random()-0.5).forEach(l => {
                let d = document.createElement('div'); d.className = 'letter'; d.innerText = l;
                d.onclick = () => { if(d.style.opacity === '0.3') return; cur += l; d.style.opacity = '0.3'; document.getElementById('info').innerText = cur;
                if(cur.length === word.length) check(cur === word, d); };
                st.appendChild(d);
            });
        } else if(mode === 'fall') {
            it.opts.forEach((o, i) => {
                setTimeout(() => {
                    let b = document.createElement('div'); b.className = 'box'; b.style.left = (10+i*30)+"%";
                    b.innerText = o.t; b.onclick = () => check(o.ok, b); st.appendChild(b);
                }, i * 1500);
            });
        } else {
            it.opts.forEach(o => {
                let b = document.createElement('button'); b.className = 'btn btn-p obj-anim'; b.innerText = o.t;
                b.onclick = () => check(o.ok, b); ctrl.appendChild(b);
            });
        }
    }

    function check(ok, el) {
        if(isBusy) return; isBusy = true;
        if(ok) { score += 10; el.style.background = "var(--s)"; } else { el.style.background = "var(--r)"; }
        document.getElementById('score-val').innerText = score + " ⭐";
        setTimeout(() => { current++; if(current < questions.length) render(); else { alert("ФИНАЛ! Твой результат: " + score); location.reload(); } }, 800);
    }

    function updateP() { let p = document.getElementById('player'); if(p) { p.style.left = px+"px"; p.style.top = py+"px"; } }
    
    function initJoy() {
        const base = document.getElementById('joy-base'), stick = document.getElementById('joy-stick');
        const handle = (e) => {
            let t = e.touches[0], r = base.getBoundingClientRect();
            let x = t.clientX - r.left - 50, y = t.clientY - r.top - 50;
            let d = Math.min(Math.sqrt(x*x + y*y), 40), a = Math.atan2(y, x);
            stick.style.left = (28 + Math.cos(a)*d) + "px"; stick.style.top = (28 + Math.sin(a)*d) + "px";
            px = Math.max(0, Math.min(px + Math.cos(a)*8, 280)); py = Math.max(0, Math.min(py + Math.sin(a)*8, 300)); updateP();
            document.querySelectorAll('.target').forEach(tar => {
                let r1 = document.getElementById('player').getBoundingClientRect(), r2 = tar.getBoundingClientRect();
                if(!(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom)) check(tar.dataset.ok === "true", tar);
            });
            e.preventDefault();
        };
        base.ontouchmove = handle;
        base.ontouchend = () => { stick.style.left="28px"; stick.style.top="28px"; };
    }

    // НОВАЯ СИСТЕМА ПЕРЕДАЧИ КОДА
    function exportCode() {
        const data = JSON.stringify({m: mode, q: questions});
        const code = btoa(encodeURIComponent(data));
        prompt("Твой надежный код игры (скопируй полностью):", code);
    }

    function importCode() {
        const code = prompt("Вставь код игры сюда:");
        if(code) {
            try {
                const decoded = decodeURIComponent(atob(code));
                const data = JSON.parse(decoded);
                mode = data.m; questions = data.q;
                startPlay();
            } catch(e) { alert("Ошибка: Код поврежден или неверный!"); }
        }
    }
</script>
</body>
</html>
